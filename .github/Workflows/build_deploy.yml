name: build & deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: setup java 21
                uses: actions/setup-java@v3
                with:
                    distribution: 'temurin'
                    java-version: '21'
                    cache: 'maven'

            - name: Java and Maven version                  
                run: |
                        java -version
                        mvn -version