name: build & deploy

on:
  workflow_dispatch:

# Required for GitHub OIDC authentication with AWS
permissions:
  contents: read
  id-token: write


# ============================================================
# STAGE 1 - BUILD AND TEST
# ============================================================
jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Java 21 and Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      
      - name: Verify Java version
        run: java -version

      - name: Verify Maven version
        run: mvn -version

      - name: Run tests
        run: mvn clean test

      - name: Build application
        run: mvn clean package

      - name: verify jar file
        run: | # ls -l target/*.jar
          ls -lh target/
          test -f target/streamflix-1.0.0.jar

      - name: Prepare Elastic Beanstalk package
        run: |
          mkdir eb-deployment
          cp target/*.jar eb-deployment/
          echo "web: java -jar *.jar" > eb-deployment/Procfile
      
      - name: upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-deployment
          path: eb-deployment/


# ============================================================
# STAGE 2 - AWS AUTHENTICATION verification
# ============================================================
  aws-authentication:
    name: AWS Authentication
    runs-on: ubuntu-latest
    
    needs: build

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: GHAServiceConnection

      - name: Verify AWS authentication
        run: aws sts get-caller-identity


# ============================================================
# STAGE 3 - TERRAFORM INFRASTRUCTURE
# ============================================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    needs: aws-authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: GHAServiceConnection

      - name: Verify AWS authentication
        run: aws sts get-caller-identity
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -diff
          terraform fmt -check
      
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
      
      - name: Terraform plan
        working-directory: terraform
        run: terraform plan
      
      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve